<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Howard Learning system</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background-color: #d9d9d9; }
        .sidebar { width: 250px; background-color: #ffffff; border-right: 2px solid #000000; display: flex; flex-direction: column; }
        .logo { padding: 20px; font-weight: bold; font-size: 14px; color: #000000; }
        .logo span { font-weight: normal; color: #ffffff; font-size: 12px; background: #000000; padding: 2px 6px; border-radius: 4px; margin-top: 5px; display: inline-block; }
        .menu-group { margin-top: 15px; }
        .menu-title { font-size: 11px; font-weight: bold; color: #708090; padding: 0 20px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .menu-item { padding: 10px 20px; font-size: 13px; color: #708090; cursor: pointer; text-decoration: none; display: block; }
        .sub-menu-item { padding-left: 35px; }
        .menu-item:hover { background-color: #ffa500; color: #ffffff; }
        .menu-item.active { background-color: #00ff00; color: #ffffff; font-weight: bold; }
        
        /* 💡 關鍵修復：將右側主區塊設定為 flex 容器，嚴格限制其高度不得超過 100vh */
        .main-content { 
            flex: 1; 
            background-color: #ffffff; 
            overflow: hidden; 
            display: flex;           /* 新增此行 */
            flex-direction: column;  /* 新增此行 */
        }
        
        /* 💡 關鍵修復：讓 iframe 絕對服從父元素的尺寸，內部網頁才能正常產生自己的卷軸 */
        .content-frame { 
            flex: 1;                 /* 新增此行 */
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;          /* 新增此行 */
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Howard Space<br><span>v1.0.4</span></div>

        <div class="menu-group">
            <div class="menu-title">Homepage</div>
            <a href="home.html" target="content_frame" class="menu-item sub-menu-item active">Homepage</a>
        </div>

        <div class="menu-group">
            <div class="menu-title">Tool</div>
            <!-- 💡 檔案名稱已更新為 sp7-mmt-analyzer.html -->
            <a href="sp7-mmt-analyzer.html" target="content_frame" class="menu-item sub-menu-item">SP7-MMT-Analyst</a>
        </div>
    </div>

    <div class="main-content">
        <iframe name="content_frame" class="content-frame" src="home.html"></iframe>
    </div>

    <script>
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                menuItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
