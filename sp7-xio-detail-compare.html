<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>SP7 XIO Detail Compare</title>
<style>
  /* 基礎容器樣式 */
  .main-container { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1000px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  h2 { text-align: center; color: #333; margin-bottom: 20px; }

  /* 拖曳上傳區塊樣式 */
  .upload-area { border: 2px dashed #4CAF50; border-radius: 8px; padding: 40px 20px; text-align: center; background-color: #f9fbf9; transition: all 0.3s ease; margin-bottom: 20px; }
  .upload-area.dragover { background-color: #e8f5e9; border-color: #2e7d32; }
  .upload-area p { color: #555; font-size: 16px; margin-bottom: 15px; }
  
  /* 按鈕樣式 */
  .btn-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
  .btn { background-color: #f1f1f1; color: #333; border: 1px solid #ccc; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; }
  .btn:hover { background-color: #e0e0e0; }
  .btn-analyze { background-color: #4CAF50; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: background-color 0.3s; margin-top: 15px; }
  .btn-analyze:hover { background-color: #45a049; }
  .btn-analyze:disabled { background-color: #cccccc; cursor: not-allowed; }
  input[type="file"] { display: none; }

  /* 檔案清單區塊樣式 */
  .file-list-container { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
  .file-item { display: flex; justify-content: space-between; align-items: center; background: #f5f5f5; padding: 10px 15px; border-radius: 6px; border: 1px solid #e0e0e0; transition: background 0.2s; }
  .file-item:hover { background: #eeeeee; }
  .file-name { font-size: 13px; color: #333; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85%; }
  .remove-btn { color: #d32f2f; font-weight: bold; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background 0.2s; }
  .remove-btn:hover { background: #ffcdd2; }

  /* 狀態提示 */
  #fileStatus { text-align: center; font-weight: bold; color: #2e7d32; margin-top: 15px; }

  /* 表格樣式 */
  .compare-table { width: 100%; border-collapse: collapse; margin-top: 25px; background-color: #fff; display: none; }
  .compare-table th, .compare-table td { border: 1px solid #e0e0e0; padding: 12px; text-align: center; font-size: 14px; }
  .compare-table th { background-color: #4CAF50; color: white; font-weight: bold; }
  .compare-table td.device-name { text-align: left; max-width: 300px; word-wrap: break-word; font-size: 13px; }
  .worst-in-lane { background-color: #fff4f4 !important; color: #d32f2f !important; border: 2px solid #d32f2f !important; }
  .rank-badge { padding: 4px 12px; border-radius: 4px; font-weight: bold; display: inline-block; white-space: nowrap; }
  .rank-1 { background-color: #d32f2f; color: white; }
  .rank-2 { background-color: #f57c00; color: white; }
  .rank-3 { background-color: #fbc02d; color: black; }
  .rank-other { background-color: #e0e0e0; color: #555; }
</style>
</head>
<body>

<div class="main-container">
  <h2>SP7 XIO Detail Compare & Ranking</h2>
  
  <div class="upload-area" id="dropZone">
    <p>📁 請將 HTML 報表檔案或資料夾「拖曳」至此區域</p>
    <p>或者點擊下方按鈕選取</p>
    <div class="btn-group">
      <label class="btn">
        選取多個檔案
        <input type="file" id="fileInput" multiple accept=".html">
      </label>
      <label class="btn">
        選取資料夾
        <input type="file" id="folderInput" webkitdirectory directory multiple>
      </label>
    </div>
  </div>
  
  <div id="fileListContainer" class="file-list-container"></div>
  <div id="fileStatus">尚未選擇任何檔案</div>
  <button class="btn-analyze" id="analyzeBtn" disabled>開始分析</button>

  <table class="compare-table" id="compareTable">
    <thead>
      <tr>
        <th>最差排名</th>
        <th>資料夾 / 裝置名稱</th>
        <th>Lane 0</th>
        <th>Lane 1</th>
        <th>Lane 2</th>
        <th>Lane 3</th>
        <th>Device 最低值</th>
      </tr>
    </thead>
    <tbody id="compareBody"></tbody>
  </table>
</div>

<script>
  let filesQueue = [];

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const folderInput = document.getElementById('folderInput');
  const fileListContainer = document.getElementById('fileListContainer');
  const fileStatus = document.getElementById('fileStatus');
  const analyzeBtn = document.getElementById('analyzeBtn');

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) addFilesToQueue(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', (e) => { addFilesToQueue(e.target.files); fileInput.value = ''; });
  folderInput.addEventListener('change', (e) => { addFilesToQueue(e.target.files); folderInput.value = ''; });

  function addFilesToQueue(files) {
    const incomingFiles = Array.from(files).filter(file => file.name.toLowerCase().endsWith('.html'));
    
    incomingFiles.forEach(newFile => {
      const newFileId = newFile.webkitRelativePath || newFile.name;
      
      const isDuplicate = filesQueue.some(existingFile => {
        const existingId = existingFile.webkitRelativePath || existingFile.name;
        return existingId === newFileId;
      });

      if (!isDuplicate) {
        filesQueue.push(newFile);
      }
    });
    
    updateUI();
  }

  function removeFile(index) {
    filesQueue.splice(index, 1);
    updateUI();
  }

  function updateUI() {
    fileListContainer.innerHTML = '';
    
    filesQueue.forEach((file, index) => {
      const fileItem = document.createElement('div');
      fileItem.className = 'file-item';
      
      const displayPath = file.webkitRelativePath || file.name; 
      
      fileItem.innerHTML = `
        <span class="file-name" title="${displayPath}">📄 ${displayPath}</span>
        <span class="remove-btn" title="移除此檔案" onclick="removeFile(${index})">✖</span>
      `;
      fileListContainer.appendChild(fileItem);
    });

    if (filesQueue.length > 0) {
      fileStatus.textContent = `已準備 ${filesQueue.length} 個 HTML 檔案，等待分析...`;
      fileStatus.style.color = "#2e7d32";
      analyzeBtn.disabled = false;
    } else {
      fileStatus.textContent = `尚未選擇任何檔案`;
      fileStatus.style.color = "#777";
      analyzeBtn.disabled = true;
      document.getElementById("compareTable").style.display = "none";
    }
  }

  analyzeBtn.addEventListener('click', async () => {
    analyzeBtn.textContent = '分析中...';
    analyzeBtn.disabled = true;
    
    let deviceData = [];

    for (let file of filesQueue) {
      let text = await file.text();
      let parser = new DOMParser();
      let doc = parser.parseFromString(text, "text/html");

      let lanes = [Infinity, Infinity, Infinity, Infinity];
      
      let rows = doc.querySelectorAll("tr");
      rows.forEach(row => {
        let cells = row.querySelectorAll("td, th");
        for (let j = 0; j < cells.length; j++) {
          let cellText = cells[j].innerText.trim();
          let nextCellText = cells[j+1] ? cells[j+1].innerText.trim() : null;
          
          if (cellText.includes("Lane 0") && nextCellText && !isNaN(parseFloat(nextCellText))) lanes[0] = parseFloat(nextCellText);
          if (cellText.includes("Lane 1") && nextCellText && !isNaN(parseFloat(nextCellText))) lanes[1] = parseFloat(nextCellText);
          if (cellText.includes("Lane 2") && nextCellText && !isNaN(parseFloat(nextCellText))) lanes[2] = parseFloat(nextCellText);
          if (cellText.includes("Lane 3") && nextCellText && !isNaN(parseFloat(nextCellText))) lanes[3] = parseFloat(nextCellText);
        }
      });

      lanes = lanes.map(v => v === Infinity ? null : v);
      
      let deviceName = file.name.replace('.html', '');
      if (file.webkitRelativePath) {
         const pathParts = file.webkitRelativePath.split('/');
         if (pathParts.length > 1) {
            deviceName = pathParts[pathParts.length - 2];
         }
      } else {
         const match = deviceName.match(/\d+:\d+:\d+\.\d+/);
         if (match) deviceName = match[0];
      }

      if (lanes.some(val => val !== null)) {
        deviceData.push({ name: deviceName, lanes: lanes });
      }
    }

    if (deviceData.length > 0) {
      renderTable(deviceData);
      fileStatus.textContent = `分析完成！共解析 ${deviceData.length} 筆資料。`;
    } else {
      alert("無法從檔案中抓取到 Lane 數值，請確認 HTML 內容格式。");
      fileStatus.textContent = `解析失敗。`;
    }

    analyzeBtn.textContent = '開始分析';
    analyzeBtn.disabled = false;
  });

  function renderTable(deviceData) {
    const minLanes = [Infinity, Infinity, Infinity, Infinity];
    
    deviceData.forEach(device => {
      device.lanes.forEach((val, i) => {
        if (val !== null && val < minLanes[i]) minLanes[i] = val;
      });
    });

    deviceData.forEach(device => {
      const valid = device.lanes.filter(v => v !== null);
      device.overallWorst = valid.length > 0 ? Math.min(...valid) : Infinity;
    });
    deviceData.sort((a, b) => a.overallWorst - b.overallWorst);

    const tbody = document.getElementById("compareBody");
    tbody.innerHTML = "";
    document.getElementById("compareTable").style.display = "table";

    deviceData.forEach((device, index) => {
      const tr = document.createElement("tr");
      
      let rankClass = "rank-other";
      if (index === 0) rankClass = "rank-1";
      else if (index === 1) rankClass = "rank-2";
      else if (index === 2) rankClass = "rank-3";
      
      const rankHtml = `<td><span class="rank-badge ${rankClass}">Rank ${index + 1}</span></td>`;
      const nameHtml = `<td class="device-name"><strong>${device.name}</strong></td>`;
      
      let lanesHtml = "";
      device.lanes.forEach((val, i) => {
        if (val === null) {
          lanesHtml += `<td>-</td>`;
        } else {
          const isWorst = val === minLanes[i];
          const tdClass = isWorst ? "worst-in-lane" : "";
          lanesHtml += `<td class="${tdClass}">${val.toFixed(2)}</td>`;
        }
      });

      const worstValHtml = `<td><strong>${device.overallWorst === Infinity ? '-' : device.overallWorst.toFixed(2)}</strong></td>`;
      
      tr.innerHTML = rankHtml + nameHtml + lanesHtml + worstValHtml;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
