<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        /* ================= CSS 排版與顏色設定區 ================= */
        
        /* 網頁基礎設定 (這是在 iframe 內部顯示的網頁設定) */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; /* 字體設定 */
            padding: 40px; /* 讓內容距離邊緣有 40 像素的留白，不會貼死視窗邊界 */
            background-color: #ffffff; /* 首頁內容的背景顏色 (純白) */
            margin: 0; /* 移除瀏覽器預設的 margin */
        }
        
        /* 主標題 <h1> 的設定 */
        h1 { 
            margin: 0; /* 移除標題預設的上下外距 */
            font-size: 28px; /* 標題字體大小為 28 像素 */
            color: #222222; /* 標題顏色 (深灰色/接近黑色) */
        }
        
        /* 副標題段落 <p> 的設定 */
        p { 
            color: #666666; /* 段落文字顏色 (中深灰色) */
            font-size: 14px; /* 段落字體大小為 14 像素 */
            margin-top: 10px; /* 與上方的主標題 <h1> 保持 10 像素的距離 */
        }
    </style>
</head>
<body>
    <!-- 這是進入首頁後，右側畫面顯示的第一組標題與文字 -->
    <h1>Howard Learning system</h1>
    <p>Each learning will be establish in this website and share to everyone</p>
</body>
</html>
