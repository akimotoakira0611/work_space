<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Data Compare - PCIe Margin Analysis</title>
<style>
  /* Data Compare 區塊樣式 */
  .compare-container {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: #f9f9f9;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .compare-container h2 { text-align: center; color: #333; }
  .compare-table { width: 100%; border-collapse: collapse; margin-top: 15px; background-color: #fff; }
  .compare-table th, .compare-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
  .compare-table th { background-color: #4CAF50; color: white; }
  
  /* 最差數值的高亮標示 */
  .worst-in-lane { background-color: #ffe6e6; color: #d32f2f; font-weight: bold; border: 2px solid #d32f2f !important; }
  
  /* 排名標籤樣式 */
  .rank-1 { background-color: #d32f2f; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
  .rank-2 { background-color: #f57c00; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
  .rank-3 { background-color: #fbc02d; color: black; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
  .rank-other { background-color: #e0e0e0; color: #333; padding: 4px 8px; border-radius: 4px; }
</style>
</head>
<body>

<!-- 假設這是您原始 HTML 報表中呈現數據的表格 (請將 id="sourceData" 加到您的原始資料表) -->
<div style="display:none;" id="originalDataArea">
  <table id="sourceData">
    <tbody>
      <!-- 格式範例：第一欄是 Device，後面四欄是 Lane 0 ~ Lane 3 的數值 -->
      <tr><td>0:0:3.4</td><td>52.50</td><td>52.50</td><td>56.00</td><td>54.00</td></tr>
      <tr><td>0:0:3.3</td><td>52.50</td><td>55.00</td><td>58.00</td><td>49.00</td></tr>
      <tr><td>0:0:3.2</td><td>59.50</td><td>60.00</td><td>49.00</td><td>42.00</td></tr>
      <tr><td>0:0:3.1</td><td>62.00</td><td>52.50</td><td>45.50</td><td>55.00</td></tr>
    </tbody>
  </table>
</div>

<!-- 新增的 Data Compare 區塊 -->
<div class="compare-container">
  <h2>Device Data Compare & Ranking</h2>
  <table class="compare-table" id="compareTable">
    <thead>
      <tr>
        <th>最差排名</th>
        <th>Device</th>
        <th>Lane 0</th>
        <th>Lane 1</th>
        <th>Lane 2</th>
        <th>Lane 3</th>
        <th>Device 最低值</th>
      </tr>
    </thead>
    <tbody id="compareBody">
      <!-- JavaScript 會自動解析上方 sourceData，並將比較結果填入此處 -->
    </tbody>
  </table>
</div>

<script>
  // 1. 動態從原始 HTML 表格抓取資料
  function extractDataFromHTML() {
    const dataRows = document.querySelectorAll("#sourceData tbody tr");
    const extractedData = [];

    dataRows.forEach(row => {
      const cells = row.querySelectorAll("td");
      if (cells.length >= 5) {
        const deviceName = cells[0].innerText.trim();
        const laneValues = [
          parseFloat(cells[1].innerText),
          parseFloat(cells[2].innerText),
          parseFloat(cells[3].innerText),
          parseFloat(cells[4].innerText)
        ];
        extractedData.push({ name: deviceName, lanes: laneValues });
      }
    });
    return extractedData;
  }

  // 執行抓取
  const deviceData = extractDataFromHTML();

  // 2. 找出每個 Lane 的最差值 (最小值)
  const numLanes = 4;
  const minLanes = Array(numLanes).fill(Infinity);
  
  deviceData.forEach(device => {
    device.lanes.forEach((val, index) => {
      if (!isNaN(val) && val < minLanes[index]) {
        minLanes[index] = val;
      }
    });
  });

  // 3. 計算每個 Device 的整體最差值，並進行排名排序
  deviceData.forEach(device => {
    const validLanes = device.lanes.filter(val => !isNaN(val));
    device.overallWorst = Math.min(...validLanes);
  });

  // 依照 overallWorst 由小到大排序 (數值越小代表越差，排越前面)
  deviceData.sort((a, b) => a.overallWorst - b.overallWorst);

  // 4. 動態生成 Compare 表格 HTML
  const tbody = document.getElementById("compareBody");
  
  deviceData.forEach((device, index) => {
    const tr = document.createElement("tr");
    
    // 設定排名樣式
    let rankClass = "rank-other";
    if (index === 0) rankClass = "rank-1";
    else if (index === 1) rankClass = "rank-2";
    else if (index === 2) rankClass = "rank-3";
    
    const rankHtml = `<td><span class="${rankClass}">Rank ${index + 1}</span></td>`;
    const nameHtml = `<td><strong>${device.name}</strong></td>`;
    
    // 生成 Lanes 的欄位並比對最差值
    let lanesHtml = "";
    device.lanes.forEach((val, laneIndex) => {
      const isWorstInLane = val === minLanes[laneIndex];
      const tdClass = isWorstInLane ? "worst-in-lane" : "";
      lanesHtml += `<td class="${tdClass}">${val.toFixed(2)}</td>`;
    });

    const worstValueHtml = `<td><strong>${device.overallWorst.toFixed(2)}</strong></td>`;
    
    tr.innerHTML = rankHtml + nameHtml + lanesHtml + worstValueHtml;
    tbody.appendChild(tr);
  });
</script>

</body>
</html>
