<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCIe Data Compare</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Calibri', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background-color: #f3f4f6; font-size: 13px; }
        .table-header { background-color: #e2e8f0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: #475569; border: 1px solid #cbd5e1; }
        .table-cell { font-size: 13px; color: #1e293b; text-align: center; border: 1px solid #cbd5e1; padding: 0.4rem; }
        .worst-highlight { background-color: #fef2f2; color: #dc2626; font-weight: bold; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- ================= 左側控制面板 (Sidebar) ================= -->
    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col h-full z-10 shadow-sm shrink-0">
        <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
            <h1 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-code-compare text-blue-600 mr-2"></i>PCIe Data Compare</h1>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <h2 class="text-xs font-bold text-gray-400 mb-2 uppercase"><i class="fa-solid fa-file-code text-yellow-400 mr-1"></i>HTML Reports</h2>
                <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-lg p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-blue-50 hover:border-blue-400 transition-colors">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400 mb-2"></i>
                    <p class="text-xs text-gray-500">Drag & Drop HTML files<br><span class="text-blue-500">or click to browse</span></p>
                    <input type="file" id="fileInput" multiple accept=".html" class="hidden">
                </div>
                <div id="fileList" class="mt-3 space-y-2"></div>
            </div>
        </div>
        
        <div class="p-4 border-t border-gray-200 bg-white">
            <button id="compareBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow transition-colors flex items-center justify-center">
                <i class="fa-solid fa-play mr-2"></i> Start Compare
            </button>
        </div>
    </aside>

    <!-- ================= 右側報表顯示區 ================= -->
    <main class="flex-1 h-full overflow-y-auto p-6 bg-gray-100 space-y-6 block">
        <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-table-list text-red-500 mr-2"></i>Comparison Result</h2>
        </div>

        <div id="alertBox" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-md shadow-sm mb-4">
            <div class="flex items-center">
                <i class="fa-solid fa-triangle-exclamation text-red-500 mr-3 text-lg"></i>
                <p id="alertMsg" class="text-sm text-red-700 font-semibold"></p>
            </div>
        </div>

        <div id="bifurcationBox" class="hidden bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-md shadow-sm mb-4">
            <div class="flex items-center">
                <i id="bifurcationIcon" class="fa-solid fa-code-branch text-yellow-600 mr-3 text-lg"></i>
                <p id="bifurcationMsg" class="text-sm text-yellow-800 font-semibold"></p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden" id="resultCard" style="display: none;">
            <div class="p-3 bg-gray-50 border-b border-gray-200 text-sm text-gray-600 font-bold">
                Worst Case Analysis (Grouped by Lane)
            </div>
            <div class="overflow-x-auto relative p-0 bg-white">
                <div id="tableContainer"></div>
            </div>
        </div>
    </main>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const compareBtn = document.getElementById('compareBtn');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const bifurcationBox = document.getElementById('bifurcationBox');
    const bifurcationMsg = document.getElementById('bifurcationMsg');
    const bifurcationIcon = document.getElementById('bifurcationIcon');
    const resultCard = document.getElementById('resultCard');
    const tableContainer = document.getElementById('tableContainer');

    let uploadedFiles = [];

    // 拖曳上傳邏輯
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-50', 'border-blue-400'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-blue-50', 'border-blue-400'));
    dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('bg-blue-50', 'border-blue-400'); handleFiles(e.dataTransfer.files); });
    dropZone.addEventListener('click', (e) => { if (e.target !== fileInput) fileInput.click(); });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    async function handleFiles(files) {
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (!file.name.endsWith('.html')) continue;
            let text = await file.text();
            uploadedFiles.push({ name: file.name, content: text });
        }
        fileInput.value = '';
        renderFileList();
    }

    function renderFileList() {
        fileList.innerHTML = '';
        uploadedFiles.forEach((file, index) => {
            fileList.innerHTML += `<div class="bg-white border border-gray-200 rounded p-2 text-xs flex justify-between items-center shadow-sm"><span class="font-semibold text-gray-700 truncate" title="${file.name}">${file.name}</span><button onclick="removeFile(${index})" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-times"></i></button></div>`;
        });
    }

    window.removeFile = function(idx) {
        uploadedFiles.splice(idx, 1);
        renderFileList();
    }

    // 開始比較邏輯
    compareBtn.addEventListener('click', () => {
        if (uploadedFiles.length < 2) {
            alert("請至少上傳兩個 HTML 檔案進行比較！");
            return;
        }
        
        alertBox.classList.add('hidden');
        bifurcationBox.classList.add('hidden');
        
        // 恢復黃色警告樣式 (避免被上次成功的綠色樣式覆蓋)
        bifurcationBox.classList.remove('bg-green-50', 'border-green-500');
        bifurcationBox.classList.add('bg-yellow-50', 'border-yellow-500');
        bifurcationIcon.classList.remove('text-green-600');
        bifurcationIcon.classList.add('text-yellow-600');
        bifurcationIcon.classList.replace('fa-check-circle', 'fa-code-branch');
        bifurcationMsg.classList.remove('text-green-800');
        bifurcationMsg.classList.add('text-yellow-800');

        resultCard.style.display = 'none';

        let parsedData = uploadedFiles.map(f => parseHTMLReport(f.content, f.name));
        
        // 1. 檢查 Speed 是否一致
        const speeds = [...new Set(parsedData.map(d => d.speed))];
        if (speeds.length > 1) {
            alertMsg.innerText = "發現不同的 Gen Speed (" + speeds.join(", ") + ")，請確認測試環境是否一致！";
            alertBox.classList.remove('hidden');
        }

        // 2. 準備比對資料
        compareData(parsedData);
    });

    function parseHTMLReport(htmlString, filename) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        
        let report = { filename: filename, speed: "Unknown", lanes: 0, margins: {} };

        // 找尋 Link Speed
        const ths = doc.querySelectorAll('th');
        ths.forEach(th => {
            if (th.textContent.includes('Link Speed') || th.textContent.includes('Detected Interface')) {
                report.speed = th.nextElementSibling.textContent.trim();
            }
        });

        // 找尋 Total Lanes
        const lbls = doc.querySelectorAll('.lbl');
        lbls.forEach(lbl => {
            if (lbl.textContent.includes('Total Lanes')) {
                report.lanes = parseInt(lbl.previousElementSibling.textContent.trim());
            }
        });

        // 擷取資料
        const tables = doc.querySelectorAll('table');
        tables.forEach(t => {
            const headers = t.querySelectorAll('th');
            if (headers.length > 0 && headers[0].textContent.includes('Lane')) {
                const rows = t.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length >= 5) {
                        const laneMatch = cells[0].textContent.match(/Lane\s+(\d+)/i);
                        if (laneMatch) {
                            const laneNum = parseInt(laneMatch[1]);
                            // 清洗非數字字元 (例如夾帶的 span 標籤或空白)
                            const eyeAreaText = cells[1].textContent.replace(/[^\d.-]/g, '');
                            const eyeArea = parseFloat(eyeAreaText);
                            
                            let vUpText = cells[2].textContent.replace(/[^\d.-]/g, '');
                            let vDownText = cells[3].textContent.replace(/[^\d.-]/g, '');
                            let uiRlText = cells[4].textContent.replace(/[^\d.-]/g, '');

                            // 取最差值
                            if(!report.margins[laneNum] || eyeArea < report.margins[laneNum].eyeArea) {
                                report.margins[laneNum] = {
                                    eyeArea: eyeArea,
                                    vUp: parseFloat(vUpText),
                                    vDown: parseFloat(vDownText),
                                    uiRl: parseFloat(uiRlText)
                                };
                            }
                        }
                    }
                });
            }
        });
        return report;
    }

    function compareData(parsedData) {
        let allLanes = new Set();
        parsedData.forEach(d => {
            Object.keys(d.margins).forEach(l => allLanes.add(parseInt(l)));
        });
        let sortedLanes = Array.from(allLanes).sort((a, b) => a - b);

        let tableHTML = `<table class="w-full border-collapse"><thead class="bg-gray-200"><tr><th class="table-header py-2 border-r border-gray-300">Lane</th>`;
        parsedData.forEach(d => {
            tableHTML += `<th class="table-header py-2 border-r border-gray-300">${d.filename}<br><span class="text-[10px] text-gray-500 font-normal">(${d.lanes} Lanes, ${d.speed})</span></th>`;
        });
        tableHTML += `</tr></thead><tbody>`;

        let sharedWorstEyeArea = Infinity;
        let unsharedWorstData = null;

        sortedLanes.forEach(lane => {
            let rowHTML = `<tr class="hover:bg-gray-50 border-b border-gray-200"><td class="table-cell font-bold text-gray-700 bg-gray-50 border-r border-gray-300">Lane ${lane}</td>`;
            
            let minEyeArea = Infinity;
            let presentCount = 0;
            
            parsedData.forEach(d => {
                if (d.margins[lane]) {
                    presentCount++;
                    if (d.margins[lane].eyeArea < minEyeArea) {
                        minEyeArea = d.margins[lane].eyeArea;
                    }
                }
            });

            // 判斷是否重疊通道 (Shared Lane)
            let isShared = (presentCount === parsedData.length);
            if (isShared && minEyeArea < sharedWorstEyeArea) {
                sharedWorstEyeArea = minEyeArea;
            } else if (!isShared) {
                if (minEyeArea < (unsharedWorstData ? unsharedWorstData.eyeArea : Infinity)) {
                    unsharedWorstData = { lane: lane, eyeArea: minEyeArea };
                }
            }

            // 產生儲存格
            parsedData.forEach(d => {
                if (d.margins[lane]) {
                    const m = d.margins[lane];
                    const isWorst = (m.eyeArea === minEyeArea);
                    const tdClass = isWorst ? 'worst-highlight' : '';
                    rowHTML += `<td class="table-cell border-r border-gray-300 ${tdClass}">
                        <div class="font-bold text-sm mb-1">Area: ${m.eyeArea}</div>
                        <div class="text-[11px] ${isWorst ? 'text-red-400' : 'text-gray-500'}">VU:${m.vUp} | VD:${m.vDown} | UI:${m.uiRl}</div>
                    </td>`;
                } else {
                    rowHTML += `<td class="table-cell text-gray-300 border-r border-gray-300">-</td>`;
                }
            });
            rowHTML += `</tr>`;
            tableHTML += rowHTML;
        });

        tableHTML += `</tbody></table>`;
        tableContainer.innerHTML = tableHTML;

        // Bifurcation 邏輯判斷與顯示
        const laneCounts = [...new Set(parsedData.map(d => d.lanes))];
        if (laneCounts.length > 1 && unsharedWorstData) {
            bifurcationBox.classList.remove('hidden');
            if (unsharedWorstData.eyeArea < sharedWorstEyeArea) {
                bifurcationMsg.innerHTML = `發現 Bifurcation 差異：未重疊的 Lane ${unsharedWorstData.lane} 測得的 Eye Area (${unsharedWorstData.eyeArea}) 比共通 Lane 的最差值 (${sharedWorstEyeArea}) 還要差！<br>👉 結論：Bifurcation 較大 (高通道數) 的 Device 表現為 Worse。`;
            } else {
                bifurcationMsg.innerHTML = `Bifurcation 檢查通過：多出來的通道數據並未低於共通通道的最差值。`;
                // 切換為綠色成功樣式
                bifurcationBox.classList.replace('bg-yellow-50', 'bg-green-50');
                bifurcationBox.classList.replace('border-yellow-500', 'border-green-500');
                bifurcationIcon.classList.replace('text-yellow-600', 'text-green-600');
                bifurcationIcon.classList.replace('fa-code-branch', 'fa-check-circle');
                bifurcationMsg.classList.replace('text-yellow-800', 'text-green-800');
            }
        }

        resultCard.style.display = 'block';
    }
</script>
</body>
</html>
