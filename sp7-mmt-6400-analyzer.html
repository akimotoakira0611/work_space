<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01-PerRank Analyzer</title>
    <!-- 引入 Tailwind CSS (這是一個將 CSS 縮寫成 class 名稱的強大工具，例如 w-72 代表寬度) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome  icon (讓你的介面有那些小圖示) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 這裡定義了一些 Tailwind 沒有涵蓋到的客製化樣式，例如卷軸的長相、特定顏色的文字 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .table-header { background-color: #e2e8f0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: #475569; }
        .table-cell { font-size: 0.875rem; color: #1e293b; text-align: center; border: 1px solid #cbd5e1; padding: 0.5rem; }
        .criteria-input { width: 50px; padding: 2px 4px; font-size: 0.75rem; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .val-green { color: #15803d; font-weight: 600; }
        .val-orange { color: #d97706; font-weight: 600; }
        .val-red { color: #dc2626; font-weight: 600; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
        .modal.active { display: flex; } /* 當 modal 加上 active 類別時，就會顯示出來 */
    </style>
</head>
<body class="h-screen flex overflow-hidden">
    <!-- 分析器的專屬控制面板 (包含上傳區、門檻值設定等) -->
    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col h-full z-10 shadow-sm">
        <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
            <h1 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-microchip text-blue-600 mr-2"></i>PerRank Analyzer</h1>
        </div>
        <div class="flex-1 overflow-y-auto sidebar-scroll p-4 space-y-6">
            
            <!-- 上傳檔案區塊 -->
            <div>
                <h2 class="text-xs font-bold text-gray-400 mb-2 uppercase"><i class="fa-solid fa-folder-open text-yellow-400 mr-1"></i>Test Data (MMT JSON)</h2>
                <!-- 拖曳檔案的虛線框 -->
                <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-lg p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-blue-50 hover:border-blue-400 transition-colors">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400 mb-2"></i>
                    <p class="text-xs text-gray-500">Drag & Drop MMT JSON files<br><span class="text-blue-500">or click to browse</span></p>
                    <input type="file" id="fileInput" multiple accept=".json,.csv,.tsv" class="hidden">
                </div>
                <!-- 顯示已上傳檔案的清單位置 -->
                <div id="fileList" class="mt-3 space-y-2"></div>
            </div>

            <!-- 門檻值設定區塊 (Criteria Preset) -->
            <div>
                <h2 class="text-xs font-bold text-gray-400 mb-2 uppercase"><i class="fa-solid fa-wrench text-gray-400 mr-1"></i>Criteria Preset</h2>
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-xs space-y-3">
                    <div class="flex items-center justify-between pb-2 border-b border-gray-200">
                        <span class="font-semibold text-gray-700">Test Item</span>
                        <div class="flex gap-2 text-gray-500">
                            <span class="w-[50px] text-center">V-Max</span>
                            <span class="w-[50px] text-center">V-Min</span>
                            <span class="w-[50px] text-center">D-Max</span>
                            <span class="w-[50px] text-center">D-Min</span>
                        </div>
                    </div>
                    <!-- 讀取 (Read) 設定 -->
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-blue-600">Read</span>
                        <div class="flex gap-2">
                            <input type="number" id="crit-read-vmax" value="70" class="criteria-input">
                            <input type="number" id="crit-read-vmin" value="-52" class="criteria-input">
                            <input type="number" id="crit-read-dmax" value="9" class="criteria-input">
                            <input type="number" id="crit-read-dmin" value="-9" class="criteria-input">
                        </div>
                    </div>
                    <!-- (省略其他 Write, CA, CS 設定以簡化程式碼長度，你原本的代碼這裡沒問題) -->
                </div>
            </div>
        </div>
        <!-- 產生報表按鈕 -->
        <div class="p-4 border-t border-gray-200 bg-white">
            <button id="generateBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow transition-colors flex items-center justify-center">
                <i class="fa-solid fa-file-invoice mr-2"></i> Generate Report
            </button>
        </div>
    </aside>

    <!-- 右側主要報表顯示區 -->
    <main class="flex-1 overflow-y-auto p-6 bg-gray-100 flex flex-col gap-6">
        <!-- 標題與匯出按鈕 -->
        <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-file-lines text-red-500 mr-2"></i>Margin Report</h2>
        </div>

        <!-- 報表表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto p-4">
                <table class="w-full border-collapse" id="mainReportTable">
                    <thead>
                        <tr>
                            <th class="table-header border border-gray-300 py-2">DIMM Vendor</th>
                            <th class="table-header border border-gray-300 py-2">Test Item</th>
                            <th class="table-header border border-gray-300 py-2 bg-gray-200">Min Vref</th>
                            <th class="table-header border border-gray-300 py-2 bg-gray-200">Max Vref</th>
                        </tr>
                    </thead>
                    <tbody id="mainReportBody">
                        <tr>
                            <td colspan="4" class="text-center text-gray-400 py-10 text-sm">No data generated yet. Please upload files and click Generate.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 補齊資訊用的跳出視窗 (Modal) -->
    <div id="infoModal" class="modal">
        <div class="bg-white rounded-lg shadow-xl w-96 overflow-hidden">
            <div class="bg-blue-600 text-white p-4 font-bold flex justify-between items-center">
                <span>Missing Information</span>
                <button onclick="closeModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div><label class="block text-xs font-bold text-gray-700 mb-1">Agesa Code</label><input type="text" id="modal-agesa" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></div>
            </div>
            <div class="bg-gray-50 p-4 border-t flex justify-end">
                <button onclick="submitModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded text-sm transition-colors">Continue</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯核心 -->
    <script>
        // 設定全域變數來儲存狀態
        let uploadedFiles = [];
        let globalMissingInfo = { agesa: "-", type: "-", rank: "-", size: "-", mb: "All Files" };
        let currentCriteria = {};

        // 綁定網頁上的元素到 JS 變數
        const generateBtn = document.getElementById('generateBtn');
        const infoModal = document.getElementById('infoModal');
        const mainReportBody = document.getElementById('mainReportBody');

        // 當按下產生報表按鈕時
        generateBtn.addEventListener('click', () => {
            if(uploadedFiles.length === 0) return alert("Please upload MMT JSON files first.");
            // 跳出對話框要求使用者輸入缺少資訊
            infoModal.classList.add('active');
        });

        function closeModal() {
            infoModal.classList.remove('active');
        }

        function submitModal() {
            globalMissingInfo.agesa = document.getElementById('modal-agesa').value || "-";
            closeModal();
            renderMainReport(); // 關閉對話框後開始畫表格
        }

        // 這是你發生錯誤的地方，負責處理 JSON 資料並繪製成表格
        function renderMainReport() {
            mainReportBody.innerHTML = '';
            
            let groups = { "All Files": uploadedFiles };

            // 🚨 【關鍵修復】: 原本這裡是 files]]，多了一個右括號導致崩潰
            for (const [groupName, files] of Object.entries(groups)) {
                if (files.length === 0) continue;
                
                // 這裡會建立 HTML 表格字串並塞入畫面中 (簡化示意)
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="table-cell" colspan="4">Data processed successfully!</td>`;
                mainReportBody.appendChild(tr);
            }
        }
    </script>
</body>
</html>
